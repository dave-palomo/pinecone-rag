AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Doc Q&A RAG API using two Python Lambda functions.

Parameters:
  AppEnv:
    Type: String
    Default: development
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
  OpenAIApiKey:
    Type: String
    NoEcho: true
  OpenAIEmbeddingModel:
    Type: String
    Default: text-embedding-3-small
  OpenAILlmModel:
    Type: String
  EmbeddingDimensions:
    Type: Number
    Default: 1536
  PineconeApiKey:
    Type: String
    NoEcho: true
  PineconeIndex:
    Type: String
  PineconeNamespace:
    Type: String
    Default: ''
  ChunkSize:
    Type: Number
    Default: 600
  ChunkOverlap:
    Type: Number
    Default: 100
  EmbeddingBatchSize:
    Type: Number
    Default: 100
  AskTopK:
    Type: Number
    Default: 3

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 98
    MemorySize: 1024
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_EMBEDDING_MODEL: !Ref OpenAIEmbeddingModel
        OPENAI_LLM_MODEL: !Ref OpenAILlmModel
        EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
        PINECONE_API_KEY: !Ref PineconeApiKey
        PINECONE_INDEX: !Ref PineconeIndex
        PINECONE_NAMESPACE: !Ref PineconeNamespace
        CHUNK_SIZE: !Ref ChunkSize
        CHUNK_OVERLAP: !Ref ChunkOverlap
        EMBEDDING_BATCH_SIZE: !Ref EmbeddingBatchSize
        ASK_TOP_K: !Ref AskTopK

Resources:
  DocQaApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub doc-qa-api-${AppEnv}
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'POST,OPTIONS'"

  IngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub doc-qa-ingest-${AppEnv}
      CodeUri: .
      Handler: lambdas.ingest.handler.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        Ingest:
          Type: Api
          Properties:
            RestApiId: !Ref DocQaApi
            Path: /ingest
            Method: post

  AskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub doc-qa-ask-${AppEnv}
      CodeUri: .
      Handler: lambdas.ask.handler.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        Ask:
          Type: Api
          Properties:
            RestApiId: !Ref DocQaApi
            Path: /ask
            Method: post

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed REST API
    Value: !Sub https://${DocQaApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod
